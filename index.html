
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<title>MX Motocross</title>
<style>
body {
  margin: 0;
  background: #171717;
  color: white;
  text-align: center;
  font-family: Arial;
}
h1 { color: #ff5722; }
canvas {
  width: 95%;
  max-width: 1000px;
  background: skyblue;
  border: 3px solid white;
}
button {
  padding: 12px 22px;
  margin: 8px;
  background: #ff5722;
  color: white;
  border: 0;
  border-radius: 7px;
  font-size: 17px;
}
</style>
</head>
<body>

<h1>🏁 MX MOTOCROSS 🏁</h1>
<p>ESPAÇO = SALTAR | SETA DIREITA = ACELERAR</p>

<canvas id="game" width="1000" height="500"></canvas>
<br>
<button onclick="jump()">SALTAR</button>
<button onclick="restart()">RECOMEÇAR</button>
<p id="score">Distância: 0 m</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let bike, obstacles, distance, speed, over;

function restart() {
  bike = { x: 150, y: 345, vy: 0, air: false };
  obstacles = [
    { x: 600, w: 90, h: 65 },
    { x: 1050, w: 110, h: 90 },
    { x: 1550, w: 90, h: 55 }
  ];
  distance = 0;
  speed = 5;
  over = false;
}

function jump() {
  if (over) return;
  if (!bike.air) {
    bike.vy = -14;
    bike.air = true;
  }
}

document.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    jump();
  }
});

function drawBike() {
  const x = bike.x, y = bike.y;

  // Pneus grossos com relevos
  for (const wx of [x, x + 65]) {
    ctx.fillStyle = "#171717";
    ctx.beginPath();
    ctx.arc(wx, y, 22, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#777";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(wx, y, 13, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = "#aaa";
    ctx.beginPath();
    ctx.arc(wx, y, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#222";
    ctx.lineWidth = 4;
    for (let a = 0; a < 8; a++) {
      const angle = a * Math.PI / 4;
      ctx.beginPath();
      ctx.moveTo(wx + 18 * Math.cos(angle),
                 y + 18 * Math.sin(angle));
      ctx.lineTo(wx + 24 * Math.cos(angle),
                 y + 24 * Math.sin(angle));
      ctx.stroke();
    }
  }

  // Quadro da mota
  ctx.strokeStyle = "#ed3020";
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x + 25, y - 28);
  ctx.lineTo(x + 65, y);
  ctx.lineTo(x, y);
  ctx.stroke();

  // Motor
  ctx.fillStyle = "#888";
  ctx.fillRect(x + 23, y - 15, 23, 20);

  // Suspensão e guiador
  ctx.strokeStyle = "#ddd";
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(x + 43, y - 29);
  ctx.lineTo(x + 65, y);
  ctx.stroke();

  ctx.strokeStyle = "#222";
  ctx.beginPath();
  ctx.moveTo(x + 39, y - 35);
  ctx.lineTo(x + 60, y - 35);
  ctx.stroke();

  // Piloto
  ctx.strokeStyle = "#1749a1";
  ctx.lineWidth = 12;
  ctx.beginPath();
  ctx.moveTo(x + 29, y - 43);
  ctx.lineTo(x + 42, y - 27);
  ctx.stroke();

  ctx.fillStyle = "#ffd32a";
  ctx.beginPath();
  ctx.arc(x + 25, y - 58, 13, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#222";
  ctx.fillRect(x + 25, y - 61, 18, 5);
}

function drawBackground() {
  ctx.fillStyle = "#83d8ff";
  ctx.fillRect(0, 0, 1000, 500);

  ctx.fillStyle = "#ffdf62";
  ctx.beginPath();
  ctx.arc(830, 75, 38, 0, Math.PI * 2);
  ctx.fill();

  // Montanhas
  ctx.fillStyle = "#669767";
  ctx.beginPath();
  ctx.moveTo(0, 330);
  ctx.lineTo(170, 120);
  ctx.lineTo(350, 330);
  ctx.lineTo(570, 150);
  ctx.lineTo(780, 330);
  ctx.lineTo(1000, 180);
  ctx.lineTo(1000, 500);
  ctx.lineTo(0, 500);
  ctx.fill();

  // Pista
  ctx.fillStyle = "#85512e";
  ctx.fillRect(0, 370, 1000, 130);
  ctx.fillStyle = "#48a63b";
  ctx.fillRect(0, 363, 1000, 9);

  // Textura
  for (let i = 0; i < 40; i++) {
    let x = ((i * 71 - distance * 3) % 1000 + 1000) % 1000;
    ctx.fillStyle = i % 2 ? "#b07b49" : "#674026";
    ctx.fillRect(x, 400 + (i % 5) * 17, 12, 3);
  }
}

function update() {
  if (over) return;

  bike.vy += 0.65;
  bike.y += bike.vy;

  if (bike.y >= 345) {
    bike.y = 345;
    bike.vy = 0;
    bike.air = false;
  }

  if (keys["ArrowRight"]) speed = Math.min(10, speed + 0.08);
  if (keys["ArrowLeft"]) speed = Math.max(3, speed - 0.08);

  distance += speed / 10;

  obstacles.forEach(o => {
    o.x -= speed;

    if (o.x + o.w < 0) {
      o.x = 1050 + Math.random() * 500;
      o.h = 50 + Math.random() * 60;
    }

    // Rampa de terra
    ctx.fillStyle = "#a56c39";
    ctx.beginPath();
    ctx.moveTo(o.x, 370);
    ctx.lineTo(o.x + o.w * 0.65, 370 - o.h);
    ctx.lineTo(o.x + o.w, 370);
    ctx.closePath();
    ctx.fill();

    // Colisão com a rampa
    if (
      bike.x + 60 > o.x + 5 &&
      bike.x + 5 < o.x + o.w - 5 &&
      bike.y + 15 > 370 - o.h
    ) {
      over = true;
    }
  });

  document.getElementById("score").textContent =
    "Distância: " + Math.floor(distance) + " m";
}

const keys = {};
document.addEventListener("keydown", e => keys[e.code] = true);
document.addEventListener("keyup", e => keys[e.code] = false);

function loop() {
  drawBackground();
  update();
  drawBike();

  if (over) {
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0, 0, 1000, 500);
    ctx.fillStyle = "#ff5722";
    ctx.font = "bold 48px Arial";
    ctx.textAlign = "center";
    ctx.fillText("FIM DE JOGO", 500, 230);
    ctx.fillStyle = "white";
    ctx.font = "23px Arial";
    ctx.fillText("Carrega em RECOMEÇAR", 500, 275);
    ctx.textAlign = "left";
  }

  requestAnimationFrame(loop);
}

restart();
loop();
</script>
</body>
</html>
